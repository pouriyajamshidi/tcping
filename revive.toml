# Revive configuration for tcping.
#
# Used by "make lint" and by the Lint GitHub workflow, so a local run and a
# CI run report exactly the same thing.
#
# Every rule revive ships with is on by default. Anything we do not want is
# turned off below, with the reason. New rules that arrive with a revive
# upgrade are therefore enforced as soon as we bump the pinned version in
# the Makefile.

enableAllRules = true
ignoreGeneratedHeader = false
severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 1

# ==================================================
# Configured rules
# ==================================================

# gofmt keeps lines reasonable already. This is only here to catch the
# occasional runaway line that hurts readability.
[rule.line-length-limit]
arguments = [200]

# map[string]int{} rather than make(map[string]int).
[rule.enforce-map-style]
arguments = ["literal"]

# []string{} rather than make([]string, 0).
[rule.enforce-slice-style]
arguments = ["literal"]

# Lowercase file names only, no dashes.
[rule.filename-format]
arguments = ["^[_a-z][_a-z0-9]*\\.go$"]

# ==================================================
# Disabled rules
# ==================================================

# Arbitrary size caps. A long function is not a bug, and we would rather
# split code when it stops reading well than when it crosses a number.
[rule.add-constant]
disabled = true
[rule.cognitive-complexity]
disabled = true
[rule.cyclomatic]
disabled = true
[rule.function-length]
disabled = true
[rule.max-public-structs]
disabled = true

# tcping is a CLI. Printing usage or a fatal error and exiting from a helper
# is the normal thing to do here, not something to route back to main.
[rule.deep-exit]
disabled = true

# Boolean parameters such as "verbose" or "succeeded" are fine and read
# clearly at the call sites we have.
[rule.flag-parameter]
disabled = true

# The printers all satisfy the same interface, so several of their methods
# legitimately ignore the receiver.
[rule.unused-receiver]
disabled = true

# Would need an allow list for fmt.Print*, Close and friends before it is
# useful. Left off until someone does that work.
[rule.unhandled-error]
disabled = true
