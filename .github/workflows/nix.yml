name: Nix

on:
  workflow_dispatch:
  # Only master here. A pull request branch is already covered by the
  # pull_request trigger below, so pushing to it would run the build twice.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    name: Build the flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Fails when the vendorHash in flake.nix no longer matches go.sum, which
      # is fixed by running "make nix-update" and committing the result.
      - name: Run make nix
        run: make nix
