name: Release

# Builds every release artifact and publishes the GitHub release when a v*
# tag is pushed, using the tag's CHANGELOG.md section as the release notes.
#
# The Homebrew tap and winget workflows are called from here once the
# release exists, so pushing the tag is the whole release. Merge into master
# first: a tag that is not on master is rejected below.
on:
  push:
    tags:
      - "v*"
  # for rebuilding a release by hand
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v3.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Work out the tag
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >>"$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          # full history so the tag can be checked against master below
          fetch-depth: 0

      - name: Ensure tag is on master
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin master
          git branch --remote --contains "$(git rev-parse "$TAG^{commit}")" | grep origin/master

      - name: Ensure the tag matches the version package
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(sed -n 's/^var Current = "\(.*\)"/\1/p' internal/version/version.go)
          if [ "$TAG" != "v$version" ]; then
            echo "[-] tag $TAG does not match internal/version/version.go ($version)"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Run make check
        run: make check

      - name: Build the release artifacts
        run: make release

      - name: Write the release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # A pre-release like v3.0.0-rc1 has no section of its own, so it
          # takes the notes of the version it leads up to.
          section="${TAG%%-*}"

          # Everything under the tag's "## v3.0.0 - 2026-09-07" heading, up
          # to the next heading, which is what used to be pasted by hand.
          awk -v tag="$section" '
            $0 ~ "^## " tag " " { found = 1; next }
            found && /^## /     { exit }
            found               { print }
          ' CHANGELOG.md >notes.md

          if [ ! -s notes.md ]; then
            echo "[-] CHANGELOG.md has no section for $section"
            exit 1
          fi

          {
            echo "## Checksums"
            echo
            echo '```'
            sha256sum output/* | awk '{sub(".*/", "", $2); print $2 ": " $1}'
            echo '```'
          } >>notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # A tag carrying a suffix, like v3.0.0-rc1, is a pre-release, so it
          # does not become what the release page offers as the latest one.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[+] Release $TAG already exists, replacing its assets and notes"
            gh release upload "$TAG" output/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" output/* --notes-file notes.md $prerelease
          fi

  # A tag carrying a suffix, like v3.0.0-rc1, is a pre-release, so brew, winget,
  # the AUR and the Linux package repository are left pointing at the last real
  # release.
  homebrew:
    needs: release
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    uses: ./.github/workflows/homebrew-tap.yml
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.tag }}

  winget:
    needs: release
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    uses: ./.github/workflows/winget.yml
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.tag }}

  aur:
    needs: release
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    uses: ./.github/workflows/aur.yml
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.tag }}

  linux-repo:
    needs: release
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    uses: ./.github/workflows/linux-repo.yml
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.tag }}
