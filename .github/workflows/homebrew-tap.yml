name: Update Homebrew tap

# Rewrites pouriyajamshidi/homebrew-tap/tcping.rb so "brew install
# pouriyajamshidi/tap/tcping" picks up the new version on its own.
#
# Called by the release workflow once the release page exists and its
# archives are uploaded. It cannot listen for "release: published": a
# release created with the GITHUB_TOKEN does not trigger other workflows.
#
# Needs a TAP_TOKEN secret: a fine grained personal access token scoped to
# the homebrew-tap repository with "Contents: read and write".
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to push to the tap, for example v3.0.0"
        required: true
        type: string
  # for re-running by hand
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to push to the tap, for example v3.0.0"
        required: true
        type: string

jobs:
  formula:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Work out the tag and version
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

      - name: Checkout the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pouriyajamshidi/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Hash the release archives
        id: sha
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            file="tcping-$target.tar.gz"
            curl -fsSL -o "$file" "$base/$file"
            echo "${target//-/_}=$(sha256sum "$file" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          done

      - name: Write the formula
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          cat >tap/tcping.rb <<EOF
          # Generated by the tcping release workflow. Do not edit by hand.
          class Tcping < Formula
            desc "Ping TCP ports. Inspired by Linux's ping utility. Written in Go"
            homepage "https://github.com/pouriyajamshidi/tcping"
            license "MIT"
            version "$VERSION"

            on_macos do
              if Hardware::CPU.arm?
                url "$base/tcping-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              else
                url "$base/tcping-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "$base/tcping-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              else
                url "$base/tcping-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install "tcping"
              bash_completion.install "completions/tcping.bash" => "tcping"
              zsh_completion.install "completions/_tcping"
              fish_completion.install "completions/tcping.fish"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tcping --version")
            end
          end
          EOF

      - name: Push the formula
        working-directory: tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcping.rb
          git diff --cached --quiet && echo "[+] Formula already up to date" && exit 0
          git commit -m "tcping $VERSION"
          git push
