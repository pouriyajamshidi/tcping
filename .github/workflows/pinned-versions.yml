name: Check pinned versions in the Makefile

# Dependabot only reads manifests it knows about, so the tool versions pinned
# in the Makefile are watched here instead. Every outdated pin turns into an
# issue, and the bump itself is still done by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read
  issues: write

jobs:
  pinned-versions:
    name: Compare the Makefile pins against the latest releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the pinned versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Reads the value of a "NAME := value" line out of the Makefile.
          pinned() { sed -n "s/^$1 := //p" Makefile; }

          # The tag of the latest release of a GitHub repository. Release
          # candidates are not returned by this endpoint, which is what we want.
          latest_release() { gh api "repos/$1/releases/latest" --jq .tag_name; }

          open_issues=$(gh issue list --state open --limit 100 --json title --jq '.[].title')
          outdated=0

          # Opens one issue per outdated pin, unless the same issue is already
          # open. The title carries both versions, so a newer release than the
          # one already reported still gets an issue of its own.
          report() {
            name=$1 current=$2 latest=$3
            if [ "$current" = "$latest" ]; then
              echo "[+] $name is up to date ($current)"
              return
            fi
            outdated=1
            title="Bump $name from $current to $latest"
            if grep -Fxq "$title" <<< "$open_issues"; then
              echo "[-] $name is outdated ($current -> $latest), issue already open"
              return
            fi
            echo "[-] $name is outdated ($current -> $latest), opening an issue"
            gh issue create --title "$title" \
              --body "The Makefile pins \`$name\` at \`$current\`, and \`$latest\` is out."
          }

          report revive "$(pinned REVIVE_VERSION)" "$(latest_release mgechev/revive)"
          report staticcheck "$(pinned STATICCHECK_VERSION)" "$(latest_release dominikh/go-tools)"
          report nfpm "$(pinned NFPM_VERSION)" "$(latest_release goreleaser/nfpm)"

          # The Nix image is not a GitHub release, so its tags come from Docker
          # Hub. Only the plain X.Y.Z tags are candidates, which leaves out
          # "latest", "master" and the rest.
          nix_latest=$(curl -fsSL "https://hub.docker.com/v2/repositories/nixos/nix/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          report nixos/nix "$(pinned NIX_IMAGE | cut -d: -f2)" "$nix_latest"

          if [ "$outdated" -eq 0 ]; then
            echo "[+] Every pin is up to date"
          fi
