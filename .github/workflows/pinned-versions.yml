name: Check pinned versions

# Dependabot only reads manifests it knows about, so the tool versions pinned
# in the Makefile are bumped here instead. Every outdated pin gets a pull
# request of its own, so they can be merged one at a time.
#
# The pull requests are opened with PINNED_VERSIONS_TOKEN rather than the
# built-in GITHUB_TOKEN, because a pull request opened by the built-in token
# does not start the other workflows, which would leave these arriving without
# a test run.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  pinned-versions:
    name: Bump the Makefile pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Also what "git push" below authenticates with.
          token: ${{ secrets.PINNED_VERSIONS_TOKEN }}

      - name: Bump the pinned versions
        env:
          GH_TOKEN: ${{ secrets.PINNED_VERSIONS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "[-] The PINNED_VERSIONS_TOKEN secret is not set"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)

          # Reads the value of a "NAME := value" line out of the Makefile.
          pinned() { sed -n "s/^$1 := //p" Makefile; }

          # The tag of the latest release of a GitHub repository. Release
          # candidates are not returned by this endpoint, which is what we want.
          latest_release() { gh api "repos/$1/releases/latest" --jq .tag_name; }

          outdated=0

          # Opens one pull request per outdated pin. The version is the tail of
          # the pinned value, which is the whole value for the tools and the
          # tag for the image.
          bump() {
            name=$1 var=$2 current=$3 latest=$4 note=$5
            if [ "$current" = "$latest" ]; then
              echo "[+] $name is up to date (${current##*:})"
              return
            fi

            outdated=1
            branch="bump-$name-${latest##*:}"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "[-] $name is outdated (${current##*:} -> ${latest##*:}), $branch already exists"
              return
            fi

            echo "[-] $name is outdated (${current##*:} -> ${latest##*:}), opening a pull request"
            git switch -C "$branch" "$base" >/dev/null
            sed -i "s|^$var := .*|$var := $latest|" Makefile
            git commit --quiet -am "bump $name to ${latest##*:}"
            git push --quiet origin "$branch"
            gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title "Bump $name from ${current##*:} to ${latest##*:}" \
              --body "$(printf 'The Makefile pinned `%s` at `%s`, and `%s` is out.\n\n%s' \
                "$name" "${current##*:}" "${latest##*:}" "$note")"
          }

          bump revive REVIVE_VERSION \
            "$(pinned REVIVE_VERSION)" "$(latest_release mgechev/revive)" \
            "A revive bump can pull in newly added rules, so read the test run before merging."
          bump staticcheck STATICCHECK_VERSION \
            "$(pinned STATICCHECK_VERSION)" "$(latest_release dominikh/go-tools)" ""
          bump nfpm NFPM_VERSION \
            "$(pinned NFPM_VERSION)" "$(latest_release goreleaser/nfpm)" \
            "nfpm only runs during a release, so the test run here does not exercise it. \`make linux\` does."

          # The Nix image is not a GitHub release, so its tags come from Docker
          # Hub. Only the plain X.Y.Z tags are candidates, which leaves out
          # "latest", "master" and the rest.
          nix_latest=$(curl -fsSL "https://hub.docker.com/v2/repositories/nixos/nix/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          bump nix NIX_IMAGE "$(pinned NIX_IMAGE)" "nixos/nix:$nix_latest" \
            "This image is only used by \"make nix CONTAINER=1\". The Nix workflow installs Nix directly, so it does not exercise this pin."

          if [ "$outdated" -eq 0 ]; then
            echo "[+] Every pin is up to date"
          fi
