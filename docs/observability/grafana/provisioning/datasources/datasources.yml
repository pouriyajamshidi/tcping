# Both places tcping can send to, so the dashboard works without anyone
# clicking through the setup.
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: home
      defaultBucket: tcping
      httpMode: POST
    secureJsonData:
      token: tcping-dev-token

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      # tcping probes once a second, so a graph step can be that short too.
      # Without this Grafana never steps by less than 15 seconds.
      timeInterval: 1s
